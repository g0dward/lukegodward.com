<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta name="description" content="London-based product designer with over a decade's experience designing products and services.">
  <link rel="canonical" href="https://lukegodward.com/">

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://lukegodward.com/">
  <meta property="og:title" content="Luke Godward">
  <meta property="og:description" content="London-based product designer with over a decade's experience designing products and services.">
  <meta property="og:image" content="https://lukegodward.com/Images/social.png">

  <!-- Twitter -->
  <meta property="twitter:card" content="summary_large_image">

  <meta property="twitter:title" content="Luke Godward">
  <meta property="twitter:description" content="London-based product designer with over a decade's experience designing products and services.">

  <!-- Favicon -->
  <link rel="icon" type="image/x-icon" href="/Images/favicon_io/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="/Images/favicon_io/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/Images/favicon_io/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/Images/favicon_io/apple-touch-icon.png">
  <link rel="manifest" href="/Images/favicon_io/site.webmanifest">
  <style>
    * {
      cursor: none !important;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      -webkit-font-smoothing: antialiased;
      margin: 0;
      padding: 0;
    }

    html {
      height: 100%;
      font-family: -apple-system, system-ui, sans-serif;
      font-size: 16px;
      line-height: 1.5;
      font-weight: 400;
    }

    body {
      overflow: hidden;
      background: #F2F2F2;
      color: #000;
    }

    .static body,
    .static * {
      cursor: auto !important;
    }

    .static body {
      overflow-y: scroll;
    }

    a,
    a:visited {
      text-decoration: none;
      color: inherit;
    }

    a.blue {
      color: #0000FF;
    }

    /* Fake cursor pinned to viewport centre */
    .cursor {
      position: fixed;
      pointer-events: none;
      top: 50%;
      left: 50%;
      width: 28px;
      height: 28px;
      margin-top: -4.9px;
      margin-left: -8.2px;
      background-image: url("Images/cursor.svg");
      background-size: 100% 100%;
      z-index: 1000;
    }

    .cursor.pointer {
      background-image: url("Images/pointinghand.svg");
      width: 32px;
      height: 32px;
      margin-top: -2px;
      margin-left: -11px;
    }

    /* Invisible full-screen link: clicking anywhere follows whatever
       link is under the centre cursor */
    .link {
      position: fixed;
      inset: 0;
      display: block;
      z-index: 200;
    }

    .static .cursor,
    .static .link {
      display: none;
    }

    main {
      position: fixed;
      transition: opacity 0.2s;
      will-change: transform;
    }

    .static main {
      position: static;
      opacity: 1 !important;
      transform: none !important;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0.75em;
    }

    .list > *:not(:last-child) {
      margin-bottom: 1.5em;
    }

    /* matches the 248px column in the Paper file */
    .static .list {
      width: 15.5em;
    }
  </style>
</head>
<body>

  <div class="cursor"></div>

  <a class="link"></a>

  <main style="opacity: 0">
    <div class="list">
      <div class="list__header">
        Luke Godward<br />
        Designer who codes<br />
        London, UK
      </div>
      <div class="list__section">
        Currently<br />
        Design lead @ 44pixels<br />
        Building interfaces for voice AI
      </div>
      <div class="list__section">
        Specialising in<br />
        0 → 1 product design<br />
        Interaction + prototyping<br />
        Product-led growth<br />
        User research<br />
        Visual design
      </div>
      <div class="list__footer">
        <a class="blue" href="mailto:lukegodward@gmail.com">Email</a>, <a class="blue" href="https://www.linkedin.com/in/luke-godward/" target="_blank" rel="noopener noreferrer">LinkedIn</a>
      </div>
    </div>
  </main>

  <script>
    "use strict";

    var $main = document.querySelector("main");
    var $links = Array.from($main.querySelectorAll("a"));
    var $cursor = document.querySelector(".cursor");
    var $link = document.querySelector(".link");
    var contentHeight = $main.getBoundingClientRect().height;

    function map(x, oldMin, oldMax, newMin, newMax) {
      return newMin + (x / (oldMax - oldMin)) * (newMax - newMin);
    }

    function intersectsCenter(element) {
      var rect = element.getBoundingClientRect();
      var cx = window.innerWidth / 2;
      var cy = window.innerHeight / 2;
      return (
        cx >= rect.left && cx < rect.right && cy >= rect.top && cy < rect.bottom
      );
    }

    // Mouse position -> page offset. The page moves opposite the mouse,
    // as if the cursor is pinned and you slide the sheet underneath it.
    // Vertical travel is amplified so one window-height of mouse movement
    // scans the full content height.
    function positionFor(x, y) {
      y = map(y, 0, window.innerHeight, 0, Math.max(window.innerHeight, contentHeight));
      return {
        x: window.innerWidth - x,
        y: window.innerHeight - y - window.innerHeight / 2
      };
    }

    function applyTransform(x, y) {
      $main.style.transform = "translate(" + x + "px, " + y + "px)";
      var $hovered = $links.find(intersectsCenter);
      if ($hovered) {
        $cursor.classList.add("pointer");
        $link.href = $hovered.href;
        $link.target = $hovered.target;
      } else {
        $cursor.classList.remove("pointer");
        $link.removeAttribute("href");
        $link.removeAttribute("target");
      }
    }

    var reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    if ("ontouchstart" in window || reducedMotion) {
      // Touch and reduced-motion get a plain scrollable page
      document.documentElement.classList.add("static");
      $main.style.opacity = 1;
    } else {
      window.addEventListener("mousemove", function show() {
        $main.style.opacity = 1;
        window.removeEventListener("mousemove", show);
      });

      window.addEventListener("mousemove", function (e) {
        var pos = positionFor(e.clientX, e.clientY);
        applyTransform(pos.x, pos.y);
      });

      window.addEventListener("resize", function () {
        contentHeight = $main.getBoundingClientRect().height;
      });
    }
  </script>
</body>
</html>
